# Template-owned. Builds ghcr.io/metalayerlab/mitm-proxy.
#
#   branch push   -> :<branch>, :<branch>-<sha>       (dev/** and feat/** expire after 7 days)
#   main          -> :edge, :main, :main-<sha>
#   pull request  -> built and smoke-tested, not pushed
#   release       -> :X.Y.Z, :X.Y, :X (1.0+), :latest  (called by release-please.yml)
#   manual        -> rebuild an existing release tag with this branch's Docker files
name: Docker image

on:
  push:
    branches: [main, 'dev/**', 'feat/**']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (e.g. v1.2.3). Empty builds the selected branch.
        type: string
        default: ''
      latest:
        description: Also move :latest (only for the newest release)
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      latest:
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/metalayerlab/mitm-proxy

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      # An old tag may predate today's Dockerfile: build it with this commit's Docker files.
      - name: Overlay Docker files from ${{ github.sha }}
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        run: |
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout "$GITHUB_SHA" -- Dockerfile .dockerignore
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # latest only from the explicit rule below: an old release must never take it.
          flavor: |
            latest=false
          # The sha tag is push-only: on PRs {{branch}} is empty, which made ":-<sha>".
          tags: |
            type=ref,event=branch,enable=${{ inputs.tag == '' }}
            type=ref,event=pr
            type=sha,prefix={{branch}}-,enable=${{ github.ref_type == 'branch' && github.event_name != 'pull_request' && inputs.tag == '' }}
            type=raw,value=edge,enable=${{ github.ref_name == 'main' && inputs.tag == '' }}
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' && !startsWith(inputs.tag, 'v0.') }}
            type=raw,value=latest,enable=${{ inputs.latest == true }}

      # Build for this runner only and prove the container starts and answers.
      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: smoke:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (/healthz)
        run: |
          docker run -d --name smoke -p 127.0.0.1:8080:8080 smoke:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              echo; echo "✓ healthy"; docker rm -f smoke > /dev/null; exit 0
            fi
            sleep 1
          done
          echo "::error::no answer on /healthz after 30s"
          docker logs smoke
          exit 1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### ${{ env.IMAGE }}"
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
