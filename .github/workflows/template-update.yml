# Template-owned: template-base. Weekly: pull each template's latest release into this
# repo with `copier update`, one PR per template, so each one keeps its own blast radius
# and can be reverted on its own. Base first, then the stack overlay, then feature
# overlays by name. Conflicts are left inline as <<<<<<< markers, listed in the PR.
#
# The token, best first: the pin-bump GitHub App when PIN_BUMP_APP_CLIENT_ID is set
# (it has the workflows permission), else the release App when RELEASE_APP_CLIENT_ID
# is set, else GITHUB_TOKEN. An App's PR runs CI, and an App can read a private
# template. Only the first can push a change to .github/workflows/: with the others,
# an update that touches them opens an issue asking for a local `copier update`, and
# so does a push or PR that fails anyway.
name: Template update

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.order.outputs.templates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # .copier-answers.base.yml, then .copier-answers.stack-*.yml, then the rest by name.
      - id: order
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          from pathlib import Path
          files = sorted(p.name for p in Path(".").glob(".copier-answers.*.yml"))
          role = lambda n: 0 if n == ".copier-answers.base.yml" else 1 if n.startswith(".copier-answers.stack-") else 2
          print("templates=" + json.dumps(sorted(files, key=lambda n: (role(n), n))))
          PY

  update:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # In order, one at a time: each PR starts from main and stands alone.
      max-parallel: 1
      fail-fast: false
      matrix:
        answers: ${{ fromJSON(needs.plan.outputs.templates) }}
    steps:
      # An App with the workflows permission (the pin-bump App, template-base's decision 0002).
      - id: workflows-app
        if: vars.PIN_BUMP_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PIN_BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.PIN_BUMP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      # Else the release App, taken to lack the workflows permission: it may move tags, so it stays narrow.
      - id: release-app
        if: vars.PIN_BUMP_APP_CLIENT_ID == '' && vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.workflows-app.outputs.token || steps.release-app.outputs.token || github.token }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: copier update
        env:
          ANSWERS: ${{ matrix.answers }}
          TOKEN: ${{ steps.workflows-app.outputs.token || steps.release-app.outputs.token || github.token }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          src=$(sed -n 's/^_src_path: *//p' "$ANSWERS")
          name=${src##*/}
          before=$(grep '^_commit:' "$ANSWERS")
          # --skip-tasks: Copier runs tasks before it reapplies the project's
          # edits, so a failing task would drop them. post-update.sh runs next.
          uvx --from 'copier>=9.19,<10' copier update -a "$ANSWERS" --trust --skip-tasks --defaults --conflict inline
          after=$(grep '^_commit:' "$ANSWERS")
          {
            echo "TEMPLATE=${name}"
            echo "FROM=${before#_commit: }"
            echo "TO=${after#_commit: }"
          } >> "$GITHUB_ENV"

      # After the merge, so the project's edits are already in: every template's
      # scripts/post-update.d/* (a lock file refresh, say). It can fail on an inline
      # conflict; the PR still opens and says so.
      - name: scripts/post-update.sh
        run: |
          if ! sh scripts/post-update.sh; then
            echo "::warning::scripts/post-update.sh failed after the update"
            echo "POST_UPDATE_FAILED=1" >> "$GITHUB_ENV"
          fi

      # Copier leaves each conflicted file unmerged in git's index, and the PR step
      # can't check out over that: stage them, markers and all. The PR body lists
      # them, and scripts/checks.d/00-base.sh fails CI until they're resolved.
      - name: scripts/stage-conflicts.sh
        run: |
          conflicts=$(sh scripts/stage-conflicts.sh)
          if [ -n "$conflicts" ]; then
            echo "::warning::conflicts to resolve: $(echo "$conflicts" | tr "\n" " ")"
            {
              echo "CONFLICTS_NOTE<<CONFLICTS_NOTE_EOF"
              echo "**Conflicts to resolve before merging.** These files have inline \`<<<<<<<\` markers, and CI fails until they're gone:"
              echo
              echo "$conflicts" | while IFS= read -r path; do echo "- \`$path\`"; done
              echo "CONFLICTS_NOTE_EOF"
            } >> "$GITHUB_ENV"
          fi

      # Decided up front from the token, not from a refused push: everything the PR
      # would commit is in the working tree by now.
      - name: Can the token push this update?
        env:
          PUSHER: ${{ steps.workflows-app.outcome == 'success' && 'workflows-app' || steps.release-app.outcome == 'success' && 'release-app' || 'github-token' }}
        run: |
          case "$PUSHER" in
            workflows-app) exit 0 ;;
            release-app) who="the release GitHub App, without the \`workflows\` permission," ;;
            *) who="\`GITHUB_TOKEN\`" ;;
          esac
          if [ -n "$(git status --porcelain -- .github/workflows)" ]; then
            echo "::notice::this update changes .github/workflows/, which ${who} can't push: opening an issue instead"
            {
              echo "NEEDS_LOCAL=1"
              echo "WHY_LOCAL=changes \`.github/workflows/\`, which ${who} can't push."
            } >> "$GITHUB_ENV"
          fi

      # Copier copies files, not labels; the issue and the PR below need this one.
      - name: The template-update label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh label create template-update --force
          --color C5DEF5 --description "copier update from a template"

      # If the push is refused (or the PR fails to open) all the same, the next
      # step opens the issue: the job never ends with no PR and no issue.
      - id: pr
        if: env.NEEDS_LOCAL != '1'
        continue-on-error: true
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.workflows-app.outputs.token || steps.release-app.outputs.token || github.token }}
          branch: chore/${{ env.TEMPLATE }}-update
          delete-branch: true
          commit-message: "chore: update from ${{ env.TEMPLATE }} ${{ env.TO }}"
          title: "chore: update from ${{ env.TEMPLATE }} ${{ env.TO }}"
          labels: template-update
          # The title stays a clean Conventional Commit: it becomes the squash commit.
          body: |
            `copier update` from ${{ env.TEMPLATE }} **${{ env.FROM }}** to **${{ env.TO }}**.

            ${{ env.CONFLICTS_NOTE }}

            ${{ env.POST_UPDATE_FAILED == '1' && (env.CONFLICTS_NOTE != '' && '**`scripts/post-update.sh` failed after the update**, probably on those markers (see the workflow log): once they are resolved, run it and commit what it changes.' || '**`scripts/post-update.sh` failed after the update** (see the workflow log): run it and commit what it changes.') || '' }}

            - Search the diff for `<<<<<<<`: conflicts are left inline for you to resolve.
            - Read the template's release notes for what changed and why.
            - Only the files this template owns change; files the project owns are never touched.

      - name: Ask for a local update
        if: env.NEEDS_LOCAL == '1' || steps.pr.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ANSWERS: ${{ matrix.answers }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_FAILED: ${{ steps.pr.outcome == 'failure' }}
        run: |
          if [ "$PR_FAILED" = true ]; then
            echo "::warning::the update couldn't be pushed or its PR opened: opening an issue instead"
            WHY_LOCAL="couldn't be pushed or its PR opened (see [the run](${RUN})). GitHub refuses a change to \`.github/workflows/\` from a token without the \`workflows\` permission."
          fi
          title="chore: update from ${TEMPLATE} ${TO} (run locally)"
          body="${TEMPLATE} **${FROM}** → **${TO}** ${WHY_LOCAL} Run \`uvx copier update -a ${ANSWERS} --trust --skip-tasks --conflict inline\` then \`sh scripts/post-update.sh\` locally and open the PR, or give this repository a GitHub App with the \`workflows\` permission (the variable \`PIN_BUMP_APP_CLIENT_ID\` and the secret \`PIN_BUMP_APP_PRIVATE_KEY\`)."
          n=$(gh issue list --label template-update --state open --search "in:title ${TEMPLATE}" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue edit "$n" --title "$title" --body "$body"
          else gh issue create --label template-update --title "$title" --body "$body"; fi
