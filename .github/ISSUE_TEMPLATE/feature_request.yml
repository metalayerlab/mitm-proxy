name: Feature request
description: A new capability or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The problem or workflow, not only the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: Optional. A sketch of the config, command or API you'd like.
  - type: markdown
    attributes:
      value: Check TODO.md's "Decided against" section first; ideas rejected there come with the reason.
