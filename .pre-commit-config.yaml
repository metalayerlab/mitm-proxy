# Template-owned: template-python. The same checks as CI, before each commit:
#   uv tool install pre-commit && pre-commit install -t pre-commit -t commit-msg
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        # As CI's whole-repo `ruff format --check`: ruff formats the Python code blocks in *.md
        # files too. Only *.md: ruff reads a .markdown file as Python.
        types_or: [python, pyi, jupyter, markdown]
        exclude: \.markdown$
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: gen-wiki
        name: generated wiki sections and docs/openapi.json
        entry: uv run scripts/gen-wiki.py --check
        language: system
        pass_filenames: false
        files: ^(src/|docs/wiki/|docs/openapi\.json$)
      # Every template's cheap checks: the stack contract, the wiki standard, version and lock.
      - id: checks
        name: scripts/checks.sh
        entry: sh scripts/checks.sh
        language: system
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
