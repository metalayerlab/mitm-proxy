# mitm-proxy configuration: every setting, with its default.
#
# Copy to /etc/mitm-proxy/config.yaml (or point MITM_PROXY_CONFIG / --config
# at it). Every key can also be set as an environment variable,
# MITM_PROXY_<KEY> (dots become underscores), or read from a file with
# MITM_PROXY_<KEY>_FILE. Secrets belong in _FILE, never in this file.
# Full reference: the wiki's In-Depth-Configuration page.

# DEBUG, INFO, WARNING or ERROR
log_level: INFO

listen:
  host: 0.0.0.0
  port: 8080

# Persistent state
state_dir: /var/lib/mitm-proxy
