# mitm-proxy configuration: every setting, with its default.
#
# Copy to /etc/mitm-proxy/config.yaml (or point MITM_PROXY_CONFIG / --config
# at it). Every key can also be set as an environment variable,
# MITM_PROXY_<KEY> (dots become underscores), or read from a file with
# MITM_PROXY_<KEY>_FILE. Secrets belong in _FILE, never in this file.
# Lists are YAML lists here, comma-separated in environment variables.
# Full reference: the wiki's In-Depth-Configuration page.

# DEBUG, INFO, WARNING or ERROR
log_level: INFO

# The admin HTTP API (health, status, metrics, CA download)
listen:
  host: 127.0.0.1
  port: 8080

# Persistent state: the root CA lives in <state_dir>/ca/
state_dir: /var/lib/mitm-proxy

proxy:
  # Not loopback? Set proxy.auth, or anyone who can reach it can use it.
  host: 127.0.0.1
  port: 3128
  # auth: secret, `user:password` -- use MITM_PROXY_PROXY_AUTH_FILE
  peek_timeout_ms: 1000
  idle_timeout_ms: 120000
  shutdown_grace_ms: 10000
  # One line per intercepted flow (logger mitm_proxy.flows)
  access_log: false
  # One line per relayed tunnel or plain-HTTP request to an unlisted host (mitm_proxy.relayed)
  access_log_relayed: false
  # Server-Timing header on intercepted responses (browser devtools); tells pages they were intercepted
  server_timing: false

# Hosts to intercept; everything else is tunnelled untouched.
intercept:
  hosts: []
  # hosts: [example.org, "*.example.org"]

# Reverse-proxy listeners: each binds `listen` (host:port) and sends every request to its
# `upstream` (http:// or https://, host and optional port, no path). Every request on a
# listener is intercepted and recorded; the bind address is its only access guard. No reverse
# listeners by default. A change here applies on restart. (TLS and HTTP/2 on the listener: later.)
# reverse:
#   - listen: 0.0.0.0:8081
#     upstream: http://api.internal:8000
#   - listen: "[::1]:8082"
#     upstream: https://llm-gateway.internal

middleware:
  # Installed middleware that may run, as name=module:attribute
  available: []
  # What runs, by name, in order
  chain: []
  # Options for each middleware, by name, passed to its class's constructor. A secret leaf
  # is written {secret_file: <path>}, never inline. From this file or
  # MITM_PROXY_MIDDLEWARE_CONFIG_FILE (a YAML file), never a plain variable.
  # config:
  #   strip:
  #     params: [utm_source, utm_medium]
  #     token: {secret_file: /run/secrets/strip-token}
  hook_timeout_ms: 5000

body:
  max_buffer_bytes: 67108864

ca:
  # cert / key: PEM, via MITM_PROXY_CA_CERT_FILE and MITM_PROXY_CA_KEY_FILE (secret).
  # Empty: <state_dir>/ca/, generated on first start.
  common_name: mitm-proxy CA
  leaf_cache_size: 1024

upstream:
  extra_ca_file: ""
  connect_timeout_ms: 10000
  idle_timeout_ms: 60000
  max_connections_per_host: 6
