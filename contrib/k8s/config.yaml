# mitm-proxy config in the cluster (non-secret settings only). Reference:
# contrib/mitm-proxy.example.yaml and the wiki's In-Depth-Configuration page.
log_level: INFO
listen:
  host: 0.0.0.0
  port: 8080
state_dir: /var/lib/mitm-proxy
proxy:
  # Anyone the NetworkPolicy lets in can use the proxy: set proxy.auth (a Secret,
  # mounted as MITM_PROXY_PROXY_AUTH_FILE; see deployment.yaml).
  host: 0.0.0.0
  port: 3128
intercept:
  hosts: []
