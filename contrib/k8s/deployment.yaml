# As a non-root user, read-only root filesystem, no capabilities (PSS restricted).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mitm-proxy
  labels:
    app.kubernetes.io/name: mitm-proxy
    app.kubernetes.io/component: server
spec:
  replicas: 1
  # State is on an emptyDir, so the root CA is regenerated whenever the pod is
  # replaced and every client must trust the new one. For a stable CA, swap it for
  # a PersistentVolumeClaim (and keep Recreate, so there are never two writers),
  # or supply the CA from a Secret (MITM_PROXY_CA_CERT_FILE / MITM_PROXY_CA_KEY_FILE).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mitm-proxy
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mitm-proxy
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mitm-proxy
          image: ghcr.io/metalayerlab/mitm-proxy
          args: ["serve"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: TZ, value: "Europe/London"}
            - {name: MITM_PROXY_CONFIG, value: /etc/mitm-proxy/config.yaml}
            # With the "secrets" volume below:
            # - {name: MITM_PROXY_PROXY_AUTH_FILE, value: /run/secrets/mitm-proxy/proxy-auth}
            # - {name: MITM_PROXY_CA_CERT_FILE, value: /run/secrets/mitm-proxy/ca.pem}
            # - {name: MITM_PROXY_CA_KEY_FILE, value: /run/secrets/mitm-proxy/ca-key.pem}
          ports:
            - {name: http, containerPort: 8080}
            - {name: proxy, containerPort: 3128}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/mitm-proxy, readOnly: true}
            - {name: state, mountPath: /var/lib/mitm-proxy}
            - {name: tmp, mountPath: /tmp}
            # - {name: secrets, mountPath: /run/secrets/mitm-proxy, readOnly: true}
      volumes:
        - name: config
          configMap: {name: mitm-proxy-config}
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
        # - name: secrets
        #   secret: {secretName: mitm-proxy, defaultMode: 0400}
