apiVersion: v1
kind: Service
metadata:
  name: mitm-proxy
  labels:
    app.kubernetes.io/name: mitm-proxy
    app.kubernetes.io/component: server
spec:
  selector:
    app.kubernetes.io/name: mitm-proxy
    app.kubernetes.io/component: server
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: proxy, port: 3128, targetPort: proxy}
