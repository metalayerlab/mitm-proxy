[project]
name = "mitm-proxy"
# Owned by release-please: never edit by hand (see the wiki's Release-Process page).
version = "0.1.1"
description = "Async Python MITM proxy with a self-signed CA — HTTP/1.1 & HTTP/2, pluggable middleware for inspecting and rewriting traffic in flight."
readme = "README.md"
requires-python = ">=3.13"
license = "Unlicense"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.15",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "h2>=4.4.1",
    "h11>=0.16.0",
    "cryptography>=50.0.2",
]

[project.scripts]
mitm-proxy = "mitm_proxy.cli:main"

[project.urls]
Homepage = "https://github.com/metalayerlab/mitm-proxy"
Documentation = "https://github.com/metalayerlab/mitm-proxy/wiki"
Changelog = "https://github.com/metalayerlab/mitm-proxy/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "types-pyyaml",
    "httpx2>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mitm_proxy"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks; scripts print, and run git, by design.
"tests/*" = ["S101"]
"scripts/*" = ["T20", "S603", "S607"]

[tool.mypy]
strict = true
files = ["src/mitm_proxy", "tests", "scripts"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config --cov --cov-report=term-missing:skip-covered"
testpaths = ["tests"]
markers = ["integration: talks to real external systems; deselect with -m 'not integration'"]
# A deprecation fails the dependency bump that brings it, not a later run.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["mitm_proxy"]
omit = ["*/__main__.py"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]
